<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" width="140" height="48">
  <defs>
    <linearGradient id="brandGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Marcador gráfico: perfil minimalista de ratinho -->
  <g transform="translate(8, 10)">
    <!-- corpo alongado -->
    <path d="M4 9 C6 5, 18 4, 20.5 8 C22.5 11, 21.5 15.5, 19 16.5 C16.5 17.5, 10 17, 8 15 C5.8 13.2, 4 11, 4 9 Z"
          fill="url(#brandGrad)" />
    <!-- orelha 1 -->
    <circle cx="9.5" cy="6.5" r="2.8" fill="url(#brandGrad)"/>
    <!-- orelha 2 -->
    <circle cx="14.8" cy="6.3" r="2.6" fill="url(#brandGrad)"/>
    <!-- cauda sutil -->
    <path d="M19 15 C21.5 15.4, 23.5 14, 24.8 13"
          fill="none" stroke="url(#brandGrad)" stroke-width="1.4"
          stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="36" y="25"
        font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial"
        font-size="19" font-weight="650" letter-spacing="1"
        fill="#0f172a">
    Behavio
  </text>
</svg>
